<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/general.html :: headerfiles}"></th:block>
    <th:block th:replace="~{fragments/general.html :: datatable-styles}"></th:block>
    <th:block th:replace="~{fragments/general.html :: map-styles}"></th:block>
</head>
<body class="app-shell sky-bg">
    <noscript>
        <div class="alert alert-danger rounded-0 mb-0 text-center">
            This application relies on JavaScript being enabled. Please enable it and reload the page.
        </div>
    </noscript>
    <th:block th:replace="~{fragments/general.html :: navbar}"></th:block>
    <main class="app-main">
        <div class="container-fluid app-container">
            <th:block th:replace="~{fragments/general.html :: login-card}"></th:block>
            <th:block th:replace="~{fragments/general.html :: page-header(
                'fa-tower-broadcast',
                'Stations Dashboard',
                'Manage the AIS and VDES stations that broadcast the Aids to Navigation messages')}"></th:block>

            <div class="card app-card" sec:authorize="isAuthenticated()">
                <div class="card-header">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <h2>Registered stations</h2>
                </div>
                <div class="card-body">
                    <div class="table-shell">
                        <table id="stations_table" class="table table-sm table-striped row-border hover w-100"></table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <th:block th:replace="~{fragments/general.html :: footer}"></th:block>

    <div class="modal fade" id="stationAreasPanel" tabindex="-1" role="dialog" aria-labelledby="stationAreasPanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="stationAreasPanelHeader">
                        <i class="fa-solid fa-map-location-dot"></i>Station Area
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="cell-muted small mb-3">
                        <i class="fa-solid fa-circle-info"></i>
                        Use the drawing tools on the left of the map to define the area covered by this station,
                        then save your changes.
                    </p>
                    <!-- map container -->
                    <div id="stationMap" class="map border"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Cancel Changes">
                        <i class="fa-solid fa-xmark"></i><span class="btn-label">Close</span>
                    </button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" title="Save Changes" onclick="saveGeometry()">
                        <i class="fa-solid fa-floppy-disk"></i><span class="btn-label">Save</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="stationConsolePanel" tabindex="-1" role="dialog" aria-labelledby="stationConsolePanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="stationConsolePanelHeader">
                        <i class="fa-solid fa-terminal"></i>Station Console
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control form-control-sm code-view" id="stationConsoleTextArea" rows="24" readonly></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Close">
                        <i class="fa-solid fa-xmark"></i><span class="btn-label">Close</span>
                    </button>
                    <button type="button" class="btn btn-primary" id="consoleConnectButton" title="Connect" onclick="connectConsole()">
                        <i class="fa-solid fa-plug"></i><span class="btn-label">Connect</span>
                    </button>
                    <button type="button" class="btn btn-warning" id="consoleDisconnectButton" title="Disconnect" onclick="disconnectConsole()" style="display: none">
                        <i class="fa-solid fa-plug-circle-xmark"></i><span class="btn-label">Disconnect</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="stationMessagesPanel" tabindex="-1" role="dialog" aria-labelledby="stationMessagesPanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-slideout modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="stationMessagesPanelHeader">
                        <i class="fa-solid fa-table"></i>Station Nodes
                    </h5>
                    <button type="button" class="btn-close float-end" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-shell">
                        <table id="station_messages_table" class="table table-sm table-striped row-border hover w-100"></table>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="float-end">
                        <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Close">
                            <i class="fa-solid fa-xmark"></i><span class="btn-label">Close</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/general.html :: confirmation-dialog}"></th:block>
    <th:block th:replace="~{fragments/general.html :: error-dialog}"></th:block>

    <th:block th:replace="~{fragments/general.html :: core-scripts}"></th:block>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js" integrity="sha512-1QvjE7BtotQjkq8PxLeF6P46gEpBRXuskzIVgjFpekzFVF4yjRgrQvTG1MTOJ3yQgvTteKAcO7DSZI92+u/yZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js" integrity="sha512-iKDtgDyTHjAitUDdLljGhenhPwrbBfqTKWO1mkhSFH3A7blITC9MhYon6SjnMhp4o0rADGw9yAC6EW4t5a4K3g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <th:block th:replace="~{fragments/general.html :: map-scripts}"></th:block>
    <th:block th:replace="~{fragments/general.html :: datatable-scripts}"></th:block>
    <script th:src="@{/src/stations.js}"></script>
</body>
</html>
